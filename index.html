<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Finch's equipment check</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f5f7; color: #111; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .band { background: #1a2a4d; color: #fff; padding: 12px 16px; font-weight: 700; letter-spacing: .04em; font-size: 13px; }
  .band.red { background: #b80d0d; }
  .card { background: #fff; border-radius: 10px; padding: 18px; margin-top: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { margin: 0 0 4px; font-size: 40px; color: #1a2a4d; }
  h1.red { color: #b80d0d; }
  h2 { margin: 0; font-size: 20px; }
  .muted { color: #555; font-size: 14px; }
  .btn { display: block; margin: 16px 0 6px; padding: 16px; text-align: center; background: #1a2a4d; color: #fff; border-radius: 10px; font-size: 19px; font-weight: 700; text-decoration: none; }
  .btn.grey { background: #888; }
  ul { padding-left: 22px; margin: 8px 0 0; }
  li { margin: 6px 0; }
  .fault { border: 3px solid #b80d0d; border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
  .fault b { color: #b80d0d; font-size: 20px; }
  .small { font-size: 13px; color: #666; margin-top: 14px; }
  .oou { background: #b80d0d; color: #fff; text-align: center; font-weight: 800; font-size: 22px; padding: 12px; border-radius: 10px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="band" id="band">FINCH'S STONE &amp; MARBLE · EQUIPMENT CHECK</div>
<div class="wrap">
  <div class="card" id="card"><h2>Loading…</h2><p class="muted">Opening the check form.</p></div>
  <p class="small">Scanned from the QR sign on the machine. Records go to the office H&amp;S register.</p>
</div>
<script>
(async function () {
  const card = document.getElementById('card');
  const band = document.getElementById('band');
  const params = new URLSearchParams(location.search);
  let id = (params.get('id') || [...params.keys()][0] || '').trim().toUpperCase();
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let assets = {}, forms = {};
  try {
    [assets, forms] = await Promise.all([
      fetch('assets.json', {cache: 'no-store'}).then(r => r.json()),
      fetch('forms.json',  {cache: 'no-store'}).then(r => r.ok ? r.json() : {}).catch(() => ({}))
    ]);
  } catch (e) {
    card.innerHTML = '<h2>Could not load the asset list</h2><p class="muted">Check the signal and try again, or use the paper sheet.</p>';
    return;
  }

  const a = assets[id];
  if (!a) {
    card.innerHTML = '<h2>Unknown check point</h2><p class="muted">Code <b>' + esc(id || '(none)') + '</b> is not on the register. Tell Graham or Ben.</p>' +
      '<p class="muted">Known: ' + Object.keys(assets).sort().map(esc).join(', ') + '</p>';
    return;
  }

  const oou = (a.status || '').toLowerCase() === 'out of use';
  if (oou) band.classList.add('red');
  const f = forms[a.form] || {};
  let formUrl = '';
  if (f.prefill_template) {
    // Microsoft Forms pre-filled links carry the choice value as a JSON string: r<qid>=%22BOOTH1%22
    formUrl = f.prefill_template.replace('{ASSET}', encodeURIComponent('"' + id + '"')).replace('{ASSET_RAW}', encodeURIComponent(id));
  } else if (f.url) {
    formUrl = f.url;
  }

  let html = '';
  if (oou) html += '<div class="oou">OUT OF USE — DO NOT USE</div>';
  if (a.photo) html += '<img src="' + esc(a.photo) + '" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-bottom:8px">';
  html += '<h1 class="' + (oou ? 'red' : '') + '">' + esc(id) + '</h1><h2>' + esc(a.name) + '</h2>' +
          '<div class="muted">' + esc(a.detail) + '<br>' + esc(a.location) + '</div>';
  if (formUrl) {
    html += '<a class="btn" href="' + formUrl + '">Open the check form →</a>' +
            '<div class="muted" style="text-align:center">Opening automatically…</div>';
  } else {
    html += '<a class="btn grey">Form not live yet — use the paper sheet</a>' +
            '<div class="muted" style="text-align:center">Recorded check: ' + esc(a.recorded) + '</div>';
  }
  html += '<p style="margin-top:16px"><b>' + (oou ? 'Why it is out of use:' : 'Before you use it — every time:') + '</b></p><ul>' +
          (a.pre_use || []).map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>';
  html += '<div class="fault"><b>FAULT? STOP.</b><br>Tag it out. Report it on the form with a photo. Tell Graham or Ben.</div>';
  card.innerHTML = html;

  if (formUrl) setTimeout(() => location.replace(formUrl), 900);
})();
</script>
</body>
</html>
