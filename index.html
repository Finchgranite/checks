<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Finch's equipment check</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f5f7; color: #111; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .band { background: #1a2a4d; color: #fff; padding: 12px 16px; font-weight: 700; letter-spacing: .04em; font-size: 13px; }
  .band.red { background: #b80d0d; }
  .card { background: #fff; border-radius: 10px; padding: 18px; margin-top: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { margin: 0 0 4px; font-size: 40px; color: #1a2a4d; }
  h1.red { color: #b80d0d; }
  h2 { margin: 0; font-size: 20px; }
  .muted { color: #555; font-size: 14px; }
  .btn { display: block; margin: 16px 0 6px; padding: 16px; text-align: center; background: #1a2a4d; color: #fff; border-radius: 10px; font-size: 19px; font-weight: 700; text-decoration: none; }
  .btn.grey { background: #888; }
  ul { padding-left: 22px; margin: 8px 0 0; }
  li { margin: 6px 0; }
  details.chk { margin-top: 10px; padding: 6px 10px; background: #f3f4f7; border-radius: 6px; }
  details.chk summary { cursor: pointer; font-size: 15px; }
  .fault { border: 3px solid #b80d0d; border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
  .fault b { color: #b80d0d; font-size: 20px; }
  .small { font-size: 13px; color: #666; margin-top: 14px; }
  .oou { background: #b80d0d; color: #fff; text-align: center; font-weight: 800; font-size: 22px; padding: 12px; border-radius: 10px; margin-bottom: 12px; }
  /* "what is due" banner (13 Oct 2026) - fed by due.json from scripts/hs_due_build.py */
  .due { border-radius: 10px; padding: 12px 14px; margin: 12px 0 4px; background: #eef1f6; }
  .due.hot { background: #fde8e8; border: 2px solid #b80d0d; }
  .due.warm { background: #fff4d6; border: 2px solid #b36b00; }
  .due h3 { margin: 0 0 6px; font-size: 15px; letter-spacing: .03em; text-transform: uppercase; color: #333; }
  .due .row { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 16px; }
  .pill { flex: none; min-width: 84px; text-align: center; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .04em; color: #fff; background: #888; }
  .pill.overdue { background: #b80d0d; } .pill.due { background: #b36b00; } .pill.first { background: #3f4a5a; } .pill.ok { background: #2e7d32; }
  .due .sub { font-size: 13px; color: #555; }
</style>
</head>
<body>
<div class="band" id="band">FINCH'S STONE &amp; MARBLE · EQUIPMENT CHECK</div>
<div class="wrap">
  <div class="card" id="card"><h2>Loading…</h2><p class="muted">Opening the check form.</p></div>
  <p class="small">Scanned from the QR sign on the machine. Records go to the office H&amp;S register.</p>
</div>
<script>
(async function () {
  const card = document.getElementById('card');
  const band = document.getElementById('band');
  const params = new URLSearchParams(location.search);
  let id = (params.get('id') || [...params.keys()][0] || '').trim().toUpperCase();
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let assets = {}, forms = {}, manuals = {}, dueAll = {};
  try {
    [assets, forms, manuals, dueAll] = await Promise.all([
      fetch('assets.json', {cache: 'no-store'}).then(r => r.json()),
      fetch('forms.json',  {cache: 'no-store'}).then(r => r.ok ? r.json() : {}).catch(() => ({})),
      fetch('manuals.json',{cache: 'no-store'}).then(r => r.ok ? r.json() : {}).catch(() => ({})),
      fetch('due.json',    {cache: 'no-store'}).then(r => r.ok ? r.json() : {}).catch(() => ({}))
    ]);
  } catch (e) {
    card.innerHTML = '<h2>Could not load the asset list</h2><p class="muted">Check the signal and try again, or use the paper sheet.</p>';
    return;
  }

  const a = assets[id];
  if (!a) {
    card.innerHTML = '<h2>Unknown check point</h2><p class="muted">Code <b>' + esc(id || '(none)') + '</b> is not on the register. Tell Graham or Ben.</p>' +
      '<p class="muted">Known: ' + Object.keys(assets).sort().map(esc).join(', ') + '</p>';
    return;
  }

  // MERGED (14 Oct 2026): BS-I2 is checked as one unit with FLTA2 - the shackle's own id just forwards.
  if (a.merged_into && assets[a.merged_into]) { location.replace(location.pathname + '?id=' + encodeURIComponent(a.merged_into)); return; }
  const oou = (a.status || '').toLowerCase() === 'out of use';
  // WITHDRAWN is not the same as OUT OF USE. Out of use means the machine is still here and
  // still needs its weekly confirmation that it is isolated, so it keeps its form. Withdrawn
  // means the item is gone - scrapped or removed from service for good. It has no options
  // entry on any form, so auto-forwarding would drop a lad onto a form where the item is not
  // even listed, and the likeliest outcome is that he picks the nearest-looking thing and
  // records a check against the WRONG asset. So: no form, no forward, just a plain statement.
  const withdrawn = (a.status || '').toLowerCase() === 'withdrawn';
  if (oou || withdrawn) band.classList.add('red');
  const f = forms[a.form] || {};
  let formUrl = '';
  if (withdrawn) {
    formUrl = '';
  } else if (f.prefill_template) {
    // Microsoft Forms pre-filled links carry the choice value as a JSON string: r<qid>=%22BOOTH1%22
    // A Choice pre-fill only selects when the value matches the option text EXACTLY, so look the
    // scanned id up in the family's `options` map first and fall back to the bare id.
    const choice = (f.options && f.options[id]) || id;
    formUrl = f.prefill_template.replace('{ASSET}', encodeURIComponent('"' + choice + '"')).replace('{ASSET_RAW}', encodeURIComponent(choice));
  } else if (f.url) {
    formUrl = f.url;
  }

  // ---- WHAT IS DUE (13 Oct 2026, Graham: "tell the person whether it's the weekly or the monthly") ----
  // due.json is rebuilt hourly from the diary + the check records (asset ids and dates only, no names).
  const due = (dueAll.assets || {})[id] || null;
  const checks = due ? (due.checks || []) : [];
  const exts = due ? (due.external || []) : [];
  const fmt = s => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); const o = {weekday: 'short', day: 'numeric', month: 'short'};
                     if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric'; return d.toLocaleDateString('en-GB', o); };
  const needsDoing = checks.filter(c => c.state === 'overdue' || c.state === 'due');
  const hot = checks.some(c => c.state === 'overdue'), warm = !hot && checks.some(c => c.state === 'due');
  let dueHtml = '';
  if (checks.length || exts.length) {
    const pillText = {overdue: 'OVERDUE', due: 'DUE TODAY', first: 'FIRST ONE', ok: 'DONE'};
    const line = c => {
      const when = c.state === 'overdue' ? 'was due ' + fmt(c.due) : c.state === 'due' ? 'due today' : 'next due ' + fmt(c.due);
      const last = c.last ? 'last done ' + fmt(c.last) : 'not recorded yet';
      return '<div class="row"><span class="pill ' + esc(c.state) + '">' + pillText[c.state] + '</span>' +
             '<div><b>' + esc(c.label) + ' check</b> — ' + esc(when) + '<div class="sub">' + esc(last) + '</div></div></div>';
    };
    dueHtml += '<div class="due ' + (hot ? 'hot' : warm ? 'warm' : '') + '"><h3>' +
               (needsDoing.length ? 'Needs doing now' : 'Nothing due today') + '</h3>' + checks.map(line).join('');
    for (const e of exts) {
      dueHtml += '<div class="row"><span class="pill ' + esc(e.state) + '">' + (e.state === 'overdue' ? 'OVERDUE' : 'BOOKED') + '</span>' +
                 '<div><b>' + esc(e.label) + '</b><div class="sub">' + (e.state === 'overdue' ? 'was due ' : 'due by ') + esc(fmt(e.due)) + '</div></div></div>';
    }
    if (dueAll.generated) dueHtml += '<div class="sub" style="margin-top:6px">As of ' + esc(dueAll.generated.replace('T', ' ')) + '</div>';
    dueHtml += '</div>';
  }
  // if exactly one check needs doing and the form has a "Check type" question we know, pre-select it
  let btnLabel = 'Do the check →';
  if (formUrl && needsDoing.length === 1 && f.check_type_q && f.cadence_options && f.cadence_options[needsDoing[0].cadence]) {
    // question ids already carry their leading "r" (same as q1_id in the template), so no prefix here
    formUrl += '&' + f.check_type_q + '=' + encodeURIComponent('"' + f.cadence_options[needsDoing[0].cadence] + '"');
    btnLabel = 'Do the ' + needsDoing[0].label.toUpperCase() + ' check →';
  } else if (formUrl && needsDoing.length === 1) {
    btnLabel = 'Do the ' + needsDoing[0].label.toUpperCase() + ' check →';
  }

  let html = '';
  if (withdrawn) html += '<div class="oou">WITHDRAWN — NOT IN SERVICE</div>';
  else if (oou) html += '<div class="oou">OUT OF USE — DO NOT USE</div>';
  if (a.photo) html += '<img src="' + esc(a.photo) + '" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-bottom:8px">';
  html += '<h1 class="' + (oou ? 'red' : '') + '">' + esc(id) + '</h1><h2>' + esc(a.name) + '</h2>' +
          '<div class="muted">' + esc(a.detail) + '<br>' + esc(a.location) + '</div>';
  if (!withdrawn) html += dueHtml;
  // A manual, a maintenance form or anything else beyond the check form turns this page from a
  // staging post into a menu. Auto-forwarding would rob the reader of the other choices, so the
  // page only forwards when the check form is the ONLY destination.
  const extras = (manuals[id] || []);
  // A due banner also makes this a page to READ, not a staging post: no auto-forward when there is one,
  // otherwise the lad never sees "the MONTHLY is due" before the form opens. One tap on the big button.
  const isMenu = extras.length > 0 || dueHtml !== '';

  if (formUrl) {
    html += '<a class="btn" href="' + formUrl + '">' + esc(btnLabel) + '</a>';
    if (!isMenu) html += '<div class="muted" style="text-align:center">Opening automatically…</div>';
  } else {
    html += withdrawn
      ? '<a class="btn grey">No check — this item has been withdrawn</a>' +
        '<div class="muted" style="text-align:center">If this is still on site, it should not be. Tell Graham or Ben.</div>'
      : '<a class="btn grey">Form not live yet — use the paper sheet</a>' +
        '<div class="muted" style="text-align:center">Recorded check: ' + esc(a.recorded) + '</div>';
  }
  for (const m of extras) {
    html += '<a class="btn" style="background:#3f4a5a" href="' + esc(m.url) + '">' + esc(m.label) + ' →</a>';
  }
  if (extras.length) {
    html += '<div class="muted" style="text-align:center;font-size:12px">Manuals open in SharePoint — ' +
            'sign in with your work account.</div>';
  }
  // the same DAILY / WEEKLY / MONTHLY lists as the printed sign (layout C, 14 Oct 2026) - from assets.json
  const list = (title, sub, items, col) => items && items.length
    ? '<details class="chk" style="border-left:4px solid ' + col + '"><summary><b>' + title + '</b>' + (sub ? ' <span class="muted">' + esc(sub) + '</span>' : '') + '</summary><ul>' +
      items.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></details>' : '';
  if (a.pre_use && a.pre_use.length) {
    html += '<p style="margin-top:16px"><b>' + (withdrawn ? 'Why it was withdrawn:' : oou ? 'Why it is out of use:' : 'DAILY — every time you use it (nothing to submit):') + '</b></p><ul>' +
            a.pre_use.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>';
  }
  if (!withdrawn) {
    html += list('WEEKLY — scan to complete', a.weekly_when, a.weekly, '#1a2a4d') +
            list('MONTHLY — scan to complete', a.monthly_when, a.monthly, '#056b66') +
            (a.other ? list(esc(a.other[0]) + ' — scan to complete', a.other[1], a.other[2], '#66306f') : '');
  }
  if (a.why) html += '<p class="muted" style="font-size:13px"><b>Why?</b> ' + esc(a.why) + '</p>';
  if (a.service) html += '<p class="muted" style="font-size:13px"><b>Service / help:</b> ' + esc(a.service) + '</p>';
  if (!withdrawn) html += '<div class="fault"><b>FAULT? STOP.</b><br>Tag it out. Report it on the form with a photo. Tell Graham or Ben.</div>';
  card.innerHTML = html;

  if (formUrl && !isMenu) setTimeout(() => location.replace(formUrl), 900);
})();
</script>
</body>
</html>
