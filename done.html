<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Finch's H&S diary - mark done</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f5f7; color: #111; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .band { background: #1a2a4d; color: #fff; padding: 12px 16px; font-weight: 700; letter-spacing: .04em; font-size: 13px; }
  .card { background: #fff; border-radius: 10px; padding: 18px; margin-top: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h2 { margin: 0 0 6px; font-size: 20px; }
  .muted { color: #555; font-size: 14px; }
  .btn { display: block; margin: 16px 0 6px; padding: 16px; text-align: center; background: #2e7d32; color: #fff; border-radius: 10px; font-size: 19px; font-weight: 700; text-decoration: none; }
  .small { font-size: 13px; color: #666; margin-top: 14px; }
  code { background: #eee; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="band">FINCH'S STONE &amp; MARBLE · H&amp;S DIARY</div>
<div class="wrap">
  <div class="card" id="card"><h2>Loading…</h2><p class="muted">Opening the "mark done" form.</p></div>
  <p class="small">Opened from a Health &amp; Safety diary entry. The record goes to the Completions list on the office H&amp;S site and the diary entry turns green within the hour.</p>
</div>
<script>
(async function () {
  const card = document.getElementById('card');
  const params = new URLSearchParams(location.search);
  const key = (params.get('item') || '').trim();
  const date = (params.get('d') || '').trim();
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if (!/^hs-[0-9a-f]{10}$/.test(key)) {
    card.innerHTML = '<h2>No diary item in the link</h2><p class="muted">Open this page from the "Done? Tap here" line inside a Health &amp; Safety diary entry.</p>';
    return;
  }
  let forms = {}, items = {};
  try {
    [forms, items] = await Promise.all([
      fetch('forms.json', {cache: 'no-store'}).then(r => r.json()),
      fetch('diary-items.json', {cache: 'no-store'}).then(r => r.ok ? r.json() : {}).catch(() => ({}))
    ]);
  } catch (e) {
    card.innerHTML = '<h2>Could not load</h2><p class="muted">Check the signal and try again.</p>';
    return;
  }
  const name = items[key] || key;
  const f = forms.done || {};
  // the form's first question receives "<key> | <yyyy-mm-dd> | <item name>" so the flow can match the diary row
  const value = key + ' | ' + date + ' | ' + name;
  let url = '';
  if (f.prefill_template) url = f.prefill_template.replace('{ITEM}', encodeURIComponent(value));
  let html = '<h2>' + esc(name) + '</h2>';
  if (date) html += '<div class="muted">Diary date ' + esc(date) + '</div>';
  if (url) {
    html += '<a class="btn" href="' + url + '">Record it as done →</a><div class="muted" style="text-align:center">Opening automatically…</div>';
    card.innerHTML = html;
    setTimeout(() => { location.href = url; }, 600);
  } else {
    html += '<p class="muted">The "mark done" form is not live yet. Tell Graham or Ben it is done, or reply to the diary invite.</p><p class="small">Item code <code>' + esc(key) + '</code></p>';
    card.innerHTML = html;
  }
})();
</script>
</body>
</html>
